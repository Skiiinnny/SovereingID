name: SonarQube

# Solo tras CI: aquí siempre hay artefacto `coverage` con OpenCover.
# Mismo OS que CI (ubuntu-latest) para que las rutas del OpenCover coincidan con el análisis.
# Un disparo directo pull_request analizaba sin cobertura → 0 % en código nuevo y quality gate incoherente.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  build:
    name: Build and analyze
    # workflow_run corre con token del repo base; no checkout/ejecución de MSBuild del árbol de un fork (S7631).
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event != 'pull_request' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 17
          distribution: "zulu"
      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"
      # Aquí: clon explícito del repo base (no el fork) con historial completo para SonarScanner.
      # `ref` = `head_sha` del run de CI (mismo commit que generó el artifact `coverage`).
      # No usar `refs/pull/N/merge`: GitHub no garantiza ese ref (p. ej. conflictos con main → fatal: couldn't find remote ref).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Ensure Sonar cache directories
        run: |
          mkdir -p "$HOME/sonar/cache"
          mkdir -p "${{ runner.temp }}/scanner"
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"
      # Interpolar ${{ secrets.SONAR_TOKEN }} en /d:sonar.token=... con cadena vacía
      # provoca: "The format of the analysis property sonar.token= is invalid".
      # Usa la variable de entorno y asegura el secreto SONAR_TOKEN en el repo.
      - name: Download coverage artifact from CI workflow
        uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: coverage
          path: coverage
          if_no_artifact_found: fail

      - name: Build and analyze
        id: sonar_scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          SCANNER="${{ runner.temp }}/scanner/dotnet-sonarscanner"
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is empty. Configure repository secret SONAR_TOKEN (SonarQube/SonarCloud user token)."
            exit 1
          fi
          "$SCANNER" begin \
            /k:"Skiiinnny_SovereingID" \
            /o:"skiiinnny" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="src/bc-auth/SovereignID.Auth.Api/wwwroot/**,src/legacy/**,graphify-out/**" \
            /d:sonar.coverage.exclusions="src/legacy/**,**/*Marker.cs,**/Program.cs"
          dotnet build "SovereignID.sln" -c Release
          "$SCANNER" end \
            /d:sonar.token="${SONAR_TOKEN}"

      # workflow_run no siempre asocia el check del job al SHA de la PR; el commit status sí.
      # En GitHub → Settings → Branches → regla en `main`: Required status checks → `SovereignID / SonarQube`.
      # En PRs, workflow_run.head_sha suele ser el merge commit de prueba, no el tip de la rama.
      # La protección de rama exige checks sobre el SHA del PR → usar pull_requests[0].head.sha.
      - name: Post commit status for merge gate
        if: always() && github.event.workflow_run.head_repository.full_name == github.repository
        env:
          WFR_EVENT: ${{ github.event.workflow_run.event }}
          WFR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WFR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WFR_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const outcome = '${{ steps.sonar_scan.outcome }}';
            const wrEvent = process.env.WFR_EVENT || '';
            const wrHeadSha = process.env.WFR_HEAD_SHA || '';
            const wrHeadBranch = process.env.WFR_HEAD_BRANCH || '';
            const wrHeadOwner = process.env.WFR_HEAD_OWNER || '';
            let sha = wrHeadSha;
            if (wrEvent === 'pull_request') {
              let headSha = null;
              const wr = context.payload.workflow_run;
              if (wr && Array.isArray(wr.pull_requests) && wr.pull_requests.length > 0 && wr.pull_requests[0].head?.sha) {
                headSha = wr.pull_requests[0].head.sha;
              }
              if (!headSha && wrHeadSha) {
                const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: wrHeadSha,
                });
                if (pulls.length > 0 && pulls[0].head?.sha) {
                  headSha = pulls[0].head.sha;
                }
              }
              if (!headSha && wrHeadBranch && wrHeadOwner) {
                const { data: openPrs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: `${wrHeadOwner}:${wrHeadBranch}`,
                });
                if (openPrs.length > 0 && openPrs[0].head?.sha) {
                  headSha = openPrs[0].head.sha;
                }
              }
              if (headSha) sha = headSha;
            }
            console.log(`SovereignID / SonarQube status: outcome=${outcome} sha=${sha} head_sha=${wrHeadSha} event=${wrEvent}`);
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'SovereignID / SonarQube',
              description: outcome === 'success' ? 'Quality gate passed' : 'Quality gate failed or Sonar error',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
