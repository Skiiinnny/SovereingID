name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      # Interpolar ${{ secrets.SONAR_TOKEN }} en /d:sonar.token=... con cadena vacía
      # provoca: "The format of the analysis property sonar.token= is invalid".
      # Usa la variable de entorno y asegura el secreto SONAR_TOKEN en el repo.
      - name: Build only (fork PR / no token)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: powershell
        run: |
          Write-Host "PR from fork detected; repository secrets are not exposed to this run."
          dotnet build "SovereignID.sln" -c Release

      - name: Build and analyze
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $scanner = "${{ runner.temp }}\scanner\dotnet-sonarscanner"
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            Write-Error "SONAR_TOKEN is empty. Configure repository secret SONAR_TOKEN (SonarQube/SonarCloud user token)."
            exit 1
          }
          & $scanner begin `
            /k:"Skiiinnny_SovereingID" `
            /o:"skiiinnny" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$($env:SONAR_TOKEN)"
          dotnet build "SovereignID.sln" -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $scanner end /d:sonar.token="$($env:SONAR_TOKEN)"
