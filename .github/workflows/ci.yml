name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore "SovereignID.sln"

      - name: Build
        run: dotnet build "SovereignID.sln" -c Release --no-restore

      - name: Test (exclude integration)
        run: dotnet test "SovereignID.sln" -c Release --no-build --filter "Category!=Integration" --settings coverlet.runsettings --results-directory coverage --logger trx

      - name: Enforce per-BC coverage floor
        shell: pwsh
        run: ./ci/Check-BcCoverage.ps1 -CoberturaPath "coverage/**/coverage.cobertura.xml" -Threshold 70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7