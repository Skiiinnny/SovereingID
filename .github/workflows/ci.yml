name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore "SovereignID.sln"

      - name: Build
        run: dotnet build "SovereignID.sln" -c Release --no-restore

      - name: Test (exclude integration)
        run: dotnet test "SovereignID.sln" -c Release --no-build --filter "Category!=Integration"